services:
  - type: web
    name: petcare-connect
    runtime: python
    repo: https://github.com/Jose-Maldonado16/PrototipoPetCare
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    plan: free